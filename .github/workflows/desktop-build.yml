name: Build Desktop App

# Builds the Tauri desktop installers on all three platforms. Runs on
# GitHub-hosted runners, so it's unaffected by local machine restrictions
# (e.g. Windows Smart App Control blocking unsigned local builds).
#
# Trigger manually from the Actions tab any time, or push a tag like
# "v1.0.0" to build a release set.
#
# The test suite (test/, plain `node --test`, no dependencies) runs on every
# push to main and every pull request, and the installers are only built —
# and a release only published — if it passes.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write  # needed to publish the GitHub Release when a tag is pushed

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test

  build:
    needs: test
    # Installers are only built for releases/manual runs, not on every push.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      - name: Install npm dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build the desktop app
        working-directory: desktop-app
        run: npm run build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-${{ matrix.platform }}
          path: |
            desktop-app/src-tauri/target/release/bundle/**/*.msi
            desktop-app/src-tauri/target/release/bundle/**/*.exe
            desktop-app/src-tauri/target/release/bundle/**/*.dmg
            desktop-app/src-tauri/target/release/bundle/**/*.app.tar.gz
            desktop-app/src-tauri/target/release/bundle/**/*.AppImage
            desktop-app/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn

      # Only runs when this build was triggered by pushing a version tag
      # (e.g. "v1.0.0") — publishes a numbered GitHub Release and attaches
      # this platform's installer to it. Each of the three matrix jobs adds
      # its own files to the same release, so it ends up with all three.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            desktop-app/src-tauri/target/release/bundle/**/*.msi
            desktop-app/src-tauri/target/release/bundle/**/*.exe
            desktop-app/src-tauri/target/release/bundle/**/*.dmg
            desktop-app/src-tauri/target/release/bundle/**/*.app.tar.gz
            desktop-app/src-tauri/target/release/bundle/**/*.AppImage
            desktop-app/src-tauri/target/release/bundle/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
